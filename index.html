<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sticky Notes</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/favicon.png">
<style>
  /* Bundled Latin subsets so the app renders correctly when sandboxed
     without network access (Flathub, Snap). Sources are vendored under
     assets/fonts/ from @fontsource/* via cdn.jsdelivr.net. */
  @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap; src:url('./assets/fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:500; font-display:swap; src:url('./assets/fonts/inter-500.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:600; font-display:swap; src:url('./assets/fonts/inter-600.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap; src:url('./assets/fonts/inter-700.woff2') format('woff2'); }
  @font-face { font-family:'Caveat'; font-style:normal; font-weight:400; font-display:swap; src:url('./assets/fonts/caveat-400.woff2') format('woff2'); }
  @font-face { font-family:'Caveat'; font-style:normal; font-weight:600; font-display:swap; src:url('./assets/fonts/caveat-600.woff2') format('woff2'); }
  @font-face { font-family:'Caveat'; font-style:normal; font-weight:700; font-display:swap; src:url('./assets/fonts/caveat-700.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:400; font-display:swap; src:url('./assets/fonts/jetbrains-mono-400.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap; src:url('./assets/fonts/jetbrains-mono-500.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:700; font-display:swap; src:url('./assets/fonts/jetbrains-mono-700.woff2') format('woff2'); }
  @font-face { font-family:'Source Serif 4'; font-style:normal; font-weight:400; font-display:swap; src:url('./assets/fonts/source-serif-4-400.woff2') format('woff2'); }
  @font-face { font-family:'Source Serif 4'; font-style:normal; font-weight:500; font-display:swap; src:url('./assets/fonts/source-serif-4-500.woff2') format('woff2'); }
  @font-face { font-family:'Source Serif 4'; font-style:normal; font-weight:600; font-display:swap; src:url('./assets/fonts/source-serif-4-600.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:swap; src:url('./assets/fonts/ibm-plex-mono-400.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-style:normal; font-weight:500; font-display:swap; src:url('./assets/fonts/ibm-plex-mono-500.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-style:normal; font-weight:600; font-display:swap; src:url('./assets/fonts/ibm-plex-mono-600.woff2') format('woff2'); }
  html, body { margin:0; padding:0; height:100%; background:#14181d; color:#eaeef3; font-family: Inter, system-ui, sans-serif; overflow:hidden; }
  * { box-sizing: border-box; }
  #root { height:100%; }
  /* Web links in rendered note bodies: inherit the note's ink color so they
     read on every theme; break anywhere so long URLs can't stretch a note. */
  .md-body a { color:inherit; text-decoration:underline; text-underline-offset:2px; overflow-wrap:anywhere; cursor:pointer; }
</style>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>
</head>

<script type="text/babel" src="utils.jsx"></script>

</html>
